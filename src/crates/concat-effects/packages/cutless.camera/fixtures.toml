# Ровная картинка остаётся собой при любых ручках: сдвиги, поворот, наклон и
# зеркальный край переводят одну и ту же точку в себя. Пробы держат блик выше
# 1.0 и альфу полупрозрачного входа на месте. Как камера гнёт реальный кадр,
# видно на карточке и в превью.

[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "default, a highlight past white"
input = [4, 1, 0.05, 1]
expect = [4, 1, 0.05, 1]

[[probe]]
name = "default, half transparent"
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.5, 0.2, 0.1, 0.5]

[[probe]]
name = "minimum, a highlight past white"
at = "min"
input = [4, 1, 0.05, 1]
expect = [4, 1, 0.05, 1]

[[probe]]
name = "maximum, a highlight past white"
at = "max"
input = [4, 1, 0.05, 1]
expect = [4, 1, 0.05, 1]

[[probe]]
name = "maximum, half transparent"
at = "max"
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.5, 0.2, 0.1, 0.5]

[[probe]]
name = "a push and a turn, a highlight past white"
params = { zoom = 250, rotation = 30, x = 20 }
input = [4, 1, 0.05, 1]
expect = [4, 1, 0.05, 1]

[[probe]]
name = "a push and a turn, half transparent"
params = { zoom = 250, rotation = 30, x = 20 }
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.5, 0.2, 0.1, 0.5]

[[probe]]
name = "a tilt and a smear, a highlight past white"
params = { tilt = 20, blur = 5, blur_angle = 45 }
input = [4, 1, 0.05, 1]
expect = [4, 1, 0.05, 1]

[[probe]]
name = "a tilt and a smear, half transparent"
params = { tilt = 20, blur = 5, blur_angle = 45 }
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.5, 0.2, 0.1, 0.5]
