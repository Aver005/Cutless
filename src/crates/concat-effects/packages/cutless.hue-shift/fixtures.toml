# Серый лежит на оси вращения, поэтому при любом угле остаётся собой.
# Цветной блик при 120° идёт по кругу: каналы переставляются.

[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "minimum, a grey"
at = "min"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "maximum, a grey"
at = "max"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "120 degrees, a highlight"
params = { angle = 120 }
input = [4, 1, 0.05, 1]
expect = [1, 0.05, 4, 1]

[[probe]]
name = "minus 120 degrees, a highlight"
params = { angle = -120 }
input = [4, 1, 0.05, 1]
expect = [0.05, 4, 1, 1]
