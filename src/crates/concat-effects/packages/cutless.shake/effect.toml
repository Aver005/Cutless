format = 2

[effect]
id = "cutless.shake"
name = "Shake"
kind = "effect"
category = "Distort"
order = 55
intensity = "amount"
description = "A handheld camera shake that jitters the picture, its edges kept by a slight zoom."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 10
default = 2
step = 0.1
unit = "%"
animate = true

[[param]]
key = "speed"
label = "Speed"
min = 1
max = 30
default = 12
step = 1
animate = true

[[param]]
key = "rotation"
label = "Rotation"
min = 0
max = 10
default = 0
step = 0.1
unit = "°"
animate = true

[wgsl]
entry = "effect.wgsl"

# Старые ручки в пикселях: 1 px примерно 1/10.8 % кадра.
[[replaces]]
id = "concat.shake"
defaults = { amount = 12, speed = 13 }
knobs = { amount = "amount / 10.8", speed = "speed" }

[[replaces]]
id = "concat.camera-shake"
defaults = { amplitude = 15, speed = 10, rotation = 2 }
knobs = { amount = "amplitude / 10.8", speed = "speed", rotation = "rotation" }
