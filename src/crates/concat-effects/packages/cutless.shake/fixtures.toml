# Ровная картинка остаётся собой при любой тряске: что здесь и проверяется.

[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "default, a highlight past white"
input = [4, 1, 0.05, 1]
expect = [4, 1, 0.05, 1]

[[probe]]
name = "minimum, a grey"
at = "min"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "maximum, a highlight past white"
at = "max"
input = [4, 1, 0.05, 1]
expect = [4, 1, 0.05, 1]

[[probe]]
name = "a hard shake, half transparent"
params = { amount = 10, speed = 30, rotation = 10 }
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.5, 0.2, 0.1, 0.5]
