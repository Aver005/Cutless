format = 2

[effect]
id = "cutless.lens-flare"
name = "Lens Flare"
kind = "effect"
category = "Light"
order = 71
intensity = "amount"
description = "A bright hotspot with a horizontal ray and ghosts strung along the lens axis."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"
animate = true

[[param]]
key = "x"
label = "Centre X"
min = 0
max = 100
default = 70
step = 1
unit = "%"
animate = true

[[param]]
key = "y"
label = "Centre Y"
min = 0
max = 100
default = 30
step = 1
unit = "%"
animate = true

[[param]]
key = "size"
label = "Size"
min = 10
max = 200
default = 100
step = 1
unit = "%"
animate = true

[wgsl]
entry = "effect.wgsl"

[[replaces]]
id = "concat.lens-flare"
defaults = { posx = 70, posy = 30, amount = 70 }
knobs = { x = "posx", y = "posy", amount = "amount", size = "100" }
